name: CI

# Gerbang kualitas minimum. Urutannya sengaja dari yang paling cepat ke
# yang paling lambat, supaya kegagalan sepele (lint) tidak menunggu test
# PGlite selesai.
#
# Semua langkah berjalan TANPA layanan eksternal: Postgres diganti PGlite
# di dalam test, jadi tidak perlu service container dan tidak ada
# ketergantungan jaringan selain `pnpm install`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Bukti integrasi DB: seluruh rantai migrasi + isolasi RLS.
      - name: Verify database (migrations + RLS)
        run: pnpm --filter @sahabat-kreator/db verify

      # Kontrak SDK tidak boleh menyimpang dari kontrak API.
      - name: Check contract drift
        run: pnpm check:drift
