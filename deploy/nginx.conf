# Nginx untuk web statis + proxy API.
#
# Semua permintaan yang butuh sesi/API diteruskan ke container `api`;
# socket dashboard & widget diteruskan ke container `realtime` (upgrade
# WebSocket wajib). Web statis dilayani dari /usr/share/nginx/html dengan
# fallback SPA karena router web ditulis tangan (bukan react-router) dan
# memakai history API.
#
# Catatan penting: API di-mount di root DAN di bawah /api (lihat
# apps/api/src/index.ts). Karena itu proxy /api/ TIDAK menghapus prefiks —
# API memang melayani /api/....

upstream sk_api {
    server api:3101;
    keepalive 32;
}

upstream sk_realtime {
    server realtime:3103;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Unggahan media (avatar, template WhatsApp) — 25 MB sejalan dengan
    # batas multipart di API.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- WebSocket realtime ---
    location /realtime/ {
        proxy_pass http://sk_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket menganggur lebih lama dari 60 detik default nginx.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API ---
    location ~ ^/(api|v1|webchat|pay|go|meta|telegram|payments|google|health|ready|version)(/|$) {
        proxy_pass http://sk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # --- Aset statis ber-hash: cache panjang ---
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA ---
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
